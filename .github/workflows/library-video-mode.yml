name: Mode 1 - Library Video Narration

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'

concurrency:
  group: library-video-mode
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
  VIDEO_MODE: library

jobs:
  library-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Mode 1 code
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python - <<'PY'
          import importlib
          for name in ['src.library_video_mode', 'src.add_voice', 'src.normal_finalizer', 'src.youtube_upload']:
              importlib.import_module(name)
              print('import ok:', name)
          PY

      - name: Check YouTube OAuth refresh token
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python -m src.youtube_upload --auth-check

      - name: Create fresh narration from selected video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.library_video_mode

      - name: Generate new voice and subtitle timings
        run: python -m src.add_voice

      - name: Replace audio, reframe to Shorts and burn subtitles
        run: python -m src.normal_finalizer

      - name: Validate final Mode 1 video
        run: |
          set -euo pipefail
          test -s output/final-video.mp4
          test -s output/voice.mp3
          test -s output/cinematic-captions.srt
          test -s output/library_source.txt
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 output/final-video.mp4)" = '1080'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 output/final-video.mp4)" = '1920'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 output/final-video.mp4)" = 'h264'
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/final-video.mp4)" = 'aac'
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/final-video.mp4)
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 10 <= d <= 46: raise SystemExit(f'Invalid duration: {d:.2f}s')
          print(f'Mode 1 video validation passed: {d:.2f}s')
          PY

      - name: Upload Mode 1 Short to YouTube
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_PRIVACY: public
          YOUTUBE_MADE_FOR_KIDS: 'false'
          YOUTUBE_CATEGORY_ID: '27'
          YOUTUBE_DESCRIPTION: 'Original narration and captions added to user-owned or properly licensed source footage.'
        run: python -m src.youtube_upload

      - name: Archive Mode 1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode1-library-video-${{ github.run_id }}
          path: |
            output/final-video.mp4
            output/voice.mp3
            output/script.txt
            output/cinematic-captions.srt
            output/caption_timing.txt
            output/library_source.txt
            output/youtube_upload.json
            data/video_library_state.json
          if-no-files-found: warn
          retention-days: 7
