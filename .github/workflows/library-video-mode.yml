name: MAIN - Fixed 60s Video Factory

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'

concurrency:
  group: main-fixed-video-factory
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
  VIDEO_MODE: library

jobs:
  library-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      - name: Verify uploaded source video
        run: |
          set -euo pipefail
          SOURCE_INPUT='assets/video_library/60 Seconds ss.mov'
          test -s "$SOURCE_INPUT"
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$SOURCE_INPUT")
          echo "Uploaded source duration: ${duration}s"
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 55 <= d <= 65:
              raise SystemExit(f"Expected approximately 60-second source, got {d:.2f}s")
          PY

      - name: Normalize source to fixed_source.mp4
        run: |
          set -euo pipefail
          ffmpeg -y -i 'assets/video_library/60 Seconds ss.mov' \
            -map 0:v:0 -an \
            -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p \
            -movflags +faststart \
            assets/video_library/fixed_source.mp4
          test -s assets/video_library/fixed_source.mp4
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 assets/video_library/fixed_source.mp4)
          echo "Normalized fixed source duration: ${duration}s"
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 55 <= d <= 65:
              raise SystemExit(f"Normalized source is not approximately 60 seconds: {d:.2f}s")
          PY

      - name: Create safe original background sound bed
        run: |
          set -euo pipefail
          mkdir -p assets
          # Generate a quiet, original ambient bed locally. No copyrighted
          # music download is required, so the workflow remains self-contained.
          ffmpeg -y \
            -f lavfi -i 'sine=frequency=196:duration=65' \
            -f lavfi -i 'sine=frequency=246.94:duration=65' \
            -f lavfi -i 'sine=frequency=293.66:duration=65' \
            -filter_complex "[0:a]volume=0.18[a0];[1:a]volume=0.12[a1];[2:a]volume=0.10[a2];[a0][a1][a2]amix=inputs=3:duration=longest,lowpass=f=1200,afade=t=in:st=0:d=2,afade=t=out:st=62:d=3,loudnorm=I=-24:TP=-2:LRA=11" \
            -c:a libmp3lame -b:a 96k assets/background_music.mp3
          test -s assets/background_music.mp3
          ffprobe -v error -show_entries format=duration -of csv=p=0 assets/background_music.mp3

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Mode 1 code
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python - <<'PY'
          import importlib
          for name in ['src.library_video_mode', 'src.add_voice', 'src.normal_finalizer', 'src.youtube_upload']:
              importlib.import_module(name)
              print('import ok:', name)
          PY

      - name: Check YouTube OAuth refresh token
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python -m src.youtube_upload --auth-check

      - name: Create fresh narration from fixed video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.library_video_mode

      - name: Generate new voice and subtitle timings
        run: python -m src.add_voice

      - name: Replace audio, reframe to Shorts and burn subtitles
        run: python -m src.normal_finalizer

      - name: Validate final Mode 1 video
        run: |
          set -euo pipefail
          test -s output/final-video.mp4
          test -s output/voice.mp3
          test -s output/cinematic-captions.srt
          test -s output/cinematic-captions.ass
          test -s output/library_source.txt
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 output/final-video.mp4)" = '1080'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 output/final-video.mp4)" = '1920'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 output/final-video.mp4)" = 'h264'
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/final-video.mp4)" = 'aac'
          final_duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/final-video.mp4)
          voice_duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/voice.mp3)
          python - "$final_duration" "$voice_duration" <<'PY'
          import sys
          final_d=float(sys.argv[1])
          voice_d=float(sys.argv[2])
          if not 8 <= voice_d <= 70:
              raise SystemExit(f'Invalid narration duration: {voice_d:.2f}s')
          if not 8 <= final_d <= 61:
              raise SystemExit(f'Invalid final duration: {final_d:.2f}s')
          if abs(final_d - voice_d) > 0.75:
              raise SystemExit(f'Final video ({final_d:.2f}s) does not match narration ({voice_d:.2f}s)')
          print(f'Main fixed-video validation passed: final={final_d:.2f}s narration={voice_d:.2f}s')
          PY

      - name: Upload MAIN Short to YouTube
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_PRIVACY: public
          YOUTUBE_MADE_FOR_KIDS: 'false'
          YOUTUBE_CATEGORY_ID: '27'
          YOUTUBE_DESCRIPTION: 'Original narration, centered captions, and original background sound added to user-owned or properly licensed source footage.'
        run: python -m src.youtube_upload

      - name: Archive MAIN result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-fixed-video-${{ github.run_id }}
          path: |
            output/final-video.mp4
            output/voice.mp3
            output/script.txt
            output/cinematic-captions.srt
            output/cinematic-captions.ass
            output/caption_timing.txt
            output/library_source.txt
            output/youtube_upload.json
            data/fixed_video_state.json
          if-no-files-found: warn
          retention-days: 7
