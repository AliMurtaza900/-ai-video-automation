name: Wan 2.2 GPU Production

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Video goal"
        required: false
        default: "Create a cinematic, high-retention YouTube Short about a surprising fact"
      max_shots:
        description: "Maximum Wan shots"
        required: false
        default: "8"

jobs:
  generate:
    runs-on: [self-hosted, wan-gpu]
    timeout-minutes: 120
    env:
      WAN_ENABLED: "true"
      WAN_MAX_SHOTS: ${{ inputs.max_shots }}
      VIDEO_GOAL: ${{ inputs.goal }}
      WAN_SIZE: "704*1280"
      WAN_OFFLOAD_MODEL: "True"
      WAN_HOME: ${{ github.workspace }}/.wan/Wan2.2
      WAN_CHECKPOINT: ${{ github.workspace }}/.wan/Wan2.2/Wan2.2-TI2V-5B
      WAN_OUTPUT_DIR: ${{ github.workspace }}/output/wan-generated

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git
          ffmpeg -version | head -n 1

      - name: Install video pipeline dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install Wan 2.2 and model
        run: bash scripts/setup_wan.sh

      - name: Verify GPU
        run: |
          nvidia-smi
          python3 - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is unavailable on the wan-gpu runner")
          print("GPU:", torch.cuda.get_device_name(0))
          vram = torch.cuda.get_device_properties(0).total_memory
          print("VRAM GB:", round(vram / 1024**3, 1))
          if vram < 20 * 1024**3:
              raise SystemExit("Wan TI2V-5B needs roughly 24 GB VRAM for the documented 720p configuration")
          PY

      - name: Run Wan 2.2 production pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python3 src/factory_bridge.py

      - name: Verify final video
        run: |
          test -s output/final-video.mp4
          test -s output/voice.mp3
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 output/final-video.mp4
          cat factory_workspace/result.json

      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: wan2.2-final-video
          path: |
            output/final-video.mp4
            output/script.txt
            assets/visuals/sources.txt
            factory_workspace/result.json
          if-no-files-found: error
