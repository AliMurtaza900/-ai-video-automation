name: Kids Animation Studio

on:
  workflow_dispatch:
    inputs:
      content_type:
        description: "Content type"
        required: true
        default: "poem"
        type: choice
        options: [poem, story]
      topic:
        description: "Story or poem topic"
        required: true
        default: "Milo and the Little Flower"
        type: string
      duration:
        description: "Target duration in minutes"
        required: true
        default: "1"
        type: string
      upload_to_youtube:
        description: "Upload to YouTube"
        required: true
        default: false
        type: boolean
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/kids-animation-studio.yml"

permissions:
  contents: read

concurrency:
  group: kids-animation-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  produce:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free local production tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run animation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate production inputs
        env:
          CONTENT_TYPE: ${{ inputs.content_type || 'poem' }}
          TOPIC: ${{ inputs.topic || 'Milo and the Little Flower' }}
          DURATION: ${{ inputs.duration || '1' }}
        run: |
          python - <<'PY'
          import os
          assert os.environ['CONTENT_TYPE'] in {'poem', 'story'}
          assert os.environ['TOPIC'].strip()
          minutes = float(os.environ['DURATION'])
          assert 1 <= minutes <= 10
          print('Production inputs validated')
          PY
      - name: Verify zero-cost production mode
        run: |
          ! grep -R "google-genai\|GEMINI_API_KEY\|VEO_MODEL\|generate_videos" -n src/kids_animation_production.py requirements.txt
      - name: Generate real zero-cost animated episode
        env:
          CONTENT_TYPE: ${{ inputs.content_type || 'poem' }}
          TOPIC: ${{ inputs.topic || 'Milo and the Little Flower' }}
          DURATION: ${{ inputs.duration || '1' }}
        run: python src/kids_animation_production.py
      - name: Validate generated MP4
        run: |
          test -s output/kids_animation/kids-animation.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/kids_animation/kids-animation.mp4
          test -s output/kids_animation/production.json
      - name: Upload animation artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-animation-${{ github.run_number }}
          path: output/kids_animation/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare YouTube upload
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube == true
        run: cp output/kids_animation/kids-animation.mp4 output/final-video.mp4
      - name: Upload to YouTube only when explicitly enabled
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube == true
        env:
          YOUTUBE_TITLE: ${{ inputs.topic }}
          YOUTUBE_DESCRIPTION: "A gentle animated children's poem or story created with our zero-cost local animation studio."
          VIDEO_GOAL: ${{ inputs.topic }}
        run: |
          python src/youtube_upload.py
          test -s output/youtube_upload.json
      - name: Publish upload record as artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube == true
        uses: actions/upload-artifact@v4
        with:
          name: youtube-upload-record-${{ github.run_number }}
          path: output/youtube_upload.json
          if-no-files-found: error
          retention-days: 7
