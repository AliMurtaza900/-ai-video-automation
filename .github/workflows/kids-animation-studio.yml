name: Kids Animation Studio

on:
  push:
    branches: [feature/animated-kids-studio]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-production-bible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run animation studio tests
        run: python -m unittest tests/test_kids_animation_studio.py
      - name: Generate sample production bible
        run: python -m src.kids_animation_studio --output output/production-bible.json
      - name: Validate production bible
        run: |
          python - <<'PY'
          import json
          p = json.load(open('output/production-bible.json', encoding='utf-8'))
          assert len(p['characters']) >= 2
          assert len(p['scenes']) >= 5
          assert all(len(s['animation_beats']) >= 3 for s in p['scenes'])
          assert all(s['music'] and s['sound_effects'] for s in p['scenes'])
          print('KIDS ANIMATION STUDIO BIBLE PASSED')
          PY
