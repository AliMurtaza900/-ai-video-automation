name: One-time fix zero-dollar 3D idx bug

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Escape literal braces in generated Blender f-string
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/zero_dollar_3d_engine_v2.py')
          s = p.read_text(encoding='utf-8')

          old_env = "c=new_collection(f'ENV_{idx:02d}_{theme}')"
          new_env = "c=new_collection(f'ENV_{{{{idx:02d}}}}_{{{{theme}}}}')"
          assert old_env in s or new_env in s, 'Expected environment f-string not found'
          s = s.replace(old_env, new_env, 1)

          if "parts={'root':root" in s:
              s = s.replace("parts={'root':root", "parts={{'root':root", 1)
              s = s.replace("'armR':None}", "'armR':None}}", 1)

          if "colors={'ocean'" in s:
              s = s.replace("colors={'ocean'", "colors={{'ocean'", 1)
              s = s.replace("'meadow':(.025,.07,.035,1)}", "'meadow':(.025,.07,.035,1)}}", 1)

          p.write_text(s, encoding='utf-8')
          print('IDX_AND_LITERAL_BRACE_FIX_APPLIED')
          PY

          python -m py_compile src/zero_dollar_3d_engine_v2.py
          PYTHONPATH=src python - <<'PY'
          from zero_dollar_3d_engine_v2 import make_script
          generated = make_script([{'action': 'test animation', 'emotion': 'happy'}], 12, 540, 960, 'frame_#####')
          compile(generated, '<generated-blender-script>', 'exec')
          assert "c=new_collection(f'ENV_{idx:02d}_{theme}')" in generated
          assert "parts={'root':root" in generated
          assert "colors={'ocean'" in generated
          print('GENERATED_SCRIPT_BRACES_AND_IDX_REGRESSION_TEST_PASSED')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- src/zero_dollar_3d_engine_v2.py; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/zero_dollar_3d_engine_v2.py
          git commit -m 'Fix zero-dollar 3D generated script f-string braces'
          git push
