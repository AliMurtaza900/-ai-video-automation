name: One-time fix zero-dollar 3D idx bug

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply and validate fix
        id: fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/zero_dollar_3d_engine_v2.py')
          s = p.read_text(encoding='utf-8')
          old = "c=new_collection(f'ENV_{idx:02d}_{theme}')"
          new = "c=new_collection(f'ENV_{{idx:02d}}_{{theme}}')"
          if old not in s:
              print('IDX_FIX_ALREADY_APPLIED')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('IDX_FIX_APPLIED')
          PY
          python -m py_compile src/zero_dollar_3d_engine_v2.py
          PYTHONPATH=src python - <<'PY'
          from zero_dollar_3d_engine_v2 import make_script
          generated = make_script([{'action': 'test animation'}], 12, 540, 960, 'frame_#####')
          compile(generated, '<generated-blender-script>', 'exec')
          assert "f'ENV_{idx:02d}_{theme}'" in generated
          print('GENERATED_SCRIPT_IDX_REGRESSION_TEST_PASSED')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- src/zero_dollar_3d_engine_v2.py; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/zero_dollar_3d_engine_v2.py
          git commit -m 'Fix zero-dollar 3D generated f-string idx scope bug'
          git push
