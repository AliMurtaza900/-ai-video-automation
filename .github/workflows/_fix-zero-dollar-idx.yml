name: One-time fix zero-dollar 3D idx bug

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refactor generated Blender script template and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/zero_dollar_3d_engine_v2.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("return f'''import bpy, math, json", "return '''import bpy, math, json"),
              ("SCENES = json.loads({payload!r})", "SCENES = json.loads(__ZERO_DOLLAR_PAYLOAD__)"),
              ("FPS = {fps}", "FPS = __ZERO_DOLLAR_FPS__"),
              ("W, H = {width}, {height}", "W, H = __ZERO_DOLLAR_WIDTH__, __ZERO_DOLLAR_HEIGHT__"),
              ("OUT = {out_pattern!r}", "OUT = __ZERO_DOLLAR_OUT_PATTERN__"),
              ("main()\n'''", "main()\n'''.replace('__ZERO_DOLLAR_PAYLOAD__', repr(payload))\n    .replace('__ZERO_DOLLAR_FPS__', str(fps))\n    .replace('__ZERO_DOLLAR_WIDTH__', str(width))\n    .replace('__ZERO_DOLLAR_HEIGHT__', str(height))\n    .replace('__ZERO_DOLLAR_OUT_PATTERN__', repr(out_pattern))"),
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          # Normalize the previous hotfix if it was applied by an earlier attempt.
          s = s.replace("c=new_collection(f'ENV_{{idx:02d}}_{{theme}}')", "c=new_collection(f'ENV_{idx:02d}_{theme}')", 1)
          p.write_text(s, encoding='utf-8')
          print('TEMPLATE_REFACTOR_CHANGED' if changed else 'TEMPLATE_REFACTOR_ALREADY_PRESENT')
          PY
          python -m py_compile src/zero_dollar_3d_engine_v2.py
          PYTHONPATH=src python - <<'PY'
          from zero_dollar_3d_engine_v2 import make_script
          generated = make_script([{'action': 'test animation', 'emotion': 'happy'}], 12, 540, 960, 'frame_#####')
          compile(generated, '<generated-blender-script>', 'exec')
          assert "c=new_collection(f'ENV_{idx:02d}_{theme}')" in generated
          assert "parts={'root':root" in generated
          print('GENERATED_SCRIPT_BRACES_AND_IDX_REGRESSION_TEST_PASSED')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- src/zero_dollar_3d_engine_v2.py; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/zero_dollar_3d_engine_v2.py
          git commit -m 'Fix zero-dollar 3D script template interpolation'
          git push
