name: Generate AI Video

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

concurrency:
  group: generate-ai-video
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  FFMPEG_THREADS: '2'
  REPO_URL: https://github.com/AliMurtaza900/-ai-video-automation.git

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository without GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/AliMurtaza900/-ai-video-automation.git" repo
          cd repo
          git checkout "${GITHUB_SHA}"

      - name: Install ffmpeg
        working-directory: repo
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: repo
        run: python -m pip install -r requirements.txt

      - name: Generate AI script (retry transient failures)
        working-directory: repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python src/main.py && exit 0
            echo "Script generation attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Persist topic memory
        working-directory: repo
        run: |
          set -e
          git config user.name "ai-video-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topic_history.json
          if git diff --cached --quiet; then
            echo "No topic history changes to commit."
            exit 0
          fi
          git commit -m "Update topic memory"
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Topic history push attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not persist topic history; video generation will continue."

      - name: Fetch relevant free visuals (retry transient failures)
        working-directory: repo
        run: |
          for attempt in 1 2 3; do
            python src/fetch_visuals_v2.py && exit 0
            echo "Visual download attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Generate AI voice and word timings
        working-directory: repo
        run: |
          for attempt in 1 2 3; do
            python src/add_voice.py && exit 0
            echo "Voice generation attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Render final vertical Short
        working-directory: repo
        run: python src/render_video.py

      - name: Validate final video before upload
        working-directory: repo
        run: |
          set -e
          test -s output/test-video.mp4
          test -s output/voice.mp3
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 output/test-video.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of csv=p=0 output/test-video.mp4
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/test-video.mp4)
          python - "$duration" <<'PY'
          import sys
          d = float(sys.argv[1])
          if d < 10 or d > 46:
              raise SystemExit(f"Invalid video duration: {d:.2f}s")
          print(f"Video validation passed: {d:.2f}s")
          PY

      - name: Prepare upload copy
        working-directory: repo
        run: |
          ffmpeg -y -i output/test-video.mp4 -i output/voice.mp3 \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 128k \
            -shortest -movflags +faststart output/final-video.mp4

      - name: Upload final video to YouTube
        working-directory: repo
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_PRIVACY: public
        run: python src/youtube_upload.py
