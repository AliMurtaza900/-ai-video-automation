name: Generate AI Video

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

concurrency:
  group: generate-ai-video
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate pipeline code
        run: |
          set -euo pipefail
          python -m compileall -q src
          python -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import importlib
          modules = [
              'src.main',
              'src.fetch_visuals',
              'src.normal_production_engine',
              'src.normal_quality_gate',
              'src.normal_character_consistency',
              'src.normal_reference_engine',
              'src.normal_scene_director',
              'src.normal_visual_planner',
              'src.normal_visual_critic',
              'src.normal_visual_repair',
              'src.add_voice',
              'src.normal_motion_engine',
              'src.normal_cinematic_renderer',
              'src.normal_finalizer',
              'src.youtube_upload',
          ]
          for name in modules:
              importlib.import_module(name)
              print(f'import ok: {name}')
          PY
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Check YouTube OAuth refresh token
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python -m src.youtube_upload --auth-check
      - name: Generate AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_GOAL: "Create a high-retention, monetization-safe YouTube Short about a genuinely surprising fact"
        run: python -m src.main
      - name: Build AI director plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.normal_production_engine
      - name: Quality gate director plan
        run: python -m src.normal_quality_gate
      - name: Build character consistency bible
        run: python -m src.normal_character_consistency
      - name: Build character reference manifest
        run: python -m src.normal_reference_engine
      - name: Build shot-level acting and cinematic direction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.normal_scene_director
      - name: Build cinematic visual plan
        run: python -m src.normal_visual_planner
      - name: Persist topic memory
        run: |
          git config user.name "ai-video-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topic_history.json
          if git diff --cached --quiet; then echo "Topic memory unchanged"; else git commit -m "Update topic memory [skip ci]"; git pull --rebase origin main; git push origin HEAD:main; fi
      - name: Fetch resilient visuals
        run: python -m src.fetch_visuals
      - name: AI visual critic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.normal_visual_critic
      - name: Automatically repair weak visuals
        run: python -m src.normal_visual_repair
      - name: Re-check repaired visuals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.normal_visual_critic
      - name: Generate AI voice and timings
        run: python -m src.add_voice
      - name: Generate real-motion cinematic scene layer
        run: python -m src.normal_motion_engine
      - name: Add captions and voice to cinematic layer
        run: python -m src.normal_finalizer
      - name: Validate final video
        run: |
          set -euo pipefail
          test -s output/final-video.mp4
          test -s output/voice.mp3
          test -s output/cinematic-video.mp4
          test -s output/normal_production/director_plan.json
          test -s output/normal_production/visual_queries.json
          test -s output/normal_production/quality_report.json
          test -s output/normal_production/visual_critic_report.json
          test -s output/normal_production/character_bible.json
          test -s output/normal_production/character_scene_prompts.json
          test -s output/normal_production/character_references.json
          test -s output/normal_production/scene_shot_plan.json
          test -s output/normal_production/motion_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('output/normal_production/motion_manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          scenes = data.get('scenes') or []
          if not scenes:
              raise SystemExit('Motion manifest contains no scenes')
          for row in scenes:
              output = Path(row.get('output', ''))
              if not output.exists() or output.stat().st_size == 0:
                  raise SystemExit(f'Missing motion clip: {output}')
          print(f'Motion manifest validation passed: {len(scenes)} scenes')
          PY
          video_info=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of csv=p=0 output/final-video.mp4)
          audio_info=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 output/final-video.mp4)
          echo "Video: $video_info"
          echo "Audio: $audio_info"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 output/final-video.mp4)" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 output/final-video.mp4)" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 output/final-video.mp4)" = "h264"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/final-video.mp4)" = "aac"
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/final-video.mp4)
          python - "$duration" <<'PY'
          import sys
          d = float(sys.argv[1])
          if not 10 <= d <= 46:
              raise SystemExit(f"Invalid video duration: {d:.2f}s")
          print(f"Video validation passed: {d:.2f}s")
          PY
      - name: Upload final video to YouTube
        if: github.event_name != 'pull_request'
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_PRIVACY: public
          YOUTUBE_MADE_FOR_KIDS: "false"
          YOUTUBE_CATEGORY_ID: "27"
          YOUTUBE_DESCRIPTION: "A short, surprising fact narrated and edited automatically for YouTube Shorts. Educational content for general audiences."
        run: python -m src.youtube_upload
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-diagnostics-${{ github.run_id }}
          path: |
            output/
            assets/visuals/sources.txt
          if-no-files-found: ignore
          retention-days: 7
