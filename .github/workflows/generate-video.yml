name: Generate AI Video

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py

      - name: Generate AI voice and word timings
        run: python src/add_voice.py

      - name: Render MP4 with synchronized captions
        run: python src/render_video.py

      - name: Combine final video and voice
        run: python - <<'PY'
import subprocess
subprocess.run([
    'ffmpeg', '-y', '-i', 'output/test-video.mp4', '-i', 'output/voice.mp3',
    '-map', '0:v:0', '-map', '1:a:0', '-c:v', 'copy', '-c:a', 'aac',
    '-shortest', 'output/final-video.mp4'
], check=True)
PY

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output/final-video.mp4
          if-no-files-found: error
