name: Generate AI Video

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

concurrency:
  group: generate-ai-video
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  FFMPEG_THREADS: '2'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate pipeline code
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_GOAL: "Create a high-retention, monetization-safe YouTube Short about a genuinely surprising fact"
        run: python src/main.py

      - name: Persist topic memory
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name "ai-video-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topic_history.json
          if git diff --cached --quiet; then
            echo "Topic memory unchanged; nothing to commit."
          else
            git commit -m "Update topic memory [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fetch resilient visuals
        run: python src/fetch_visuals.py

      - name: Generate AI voice and timings
        run: python src/add_voice.py

      - name: Render final vertical Short
        run: python src/render_video.py

      - name: Validate final video
        run: |
          set -euo pipefail
          test -s output/test-video.mp4
          test -s output/voice.mp3
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of csv=p=0 output/test-video.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of csv=p=0 output/test-video.mp4
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/test-video.mp4)
          python - "$duration" <<'PY'
          import sys
          d = float(sys.argv[1])
          if not 10 <= d <= 46:
              raise SystemExit(f"Invalid video duration: {d:.2f}s")
          print(f"Video validation passed: {d:.2f}s")
          PY

      - name: Upload final video to YouTube
        if: github.event_name != 'pull_request'
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_PRIVACY: public
          YOUTUBE_MADE_FOR_KIDS: "false"
          YOUTUBE_CATEGORY_ID: "27"
          YOUTUBE_DESCRIPTION: "A short, surprising fact narrated and edited automatically for YouTube Shorts. Educational content for general audiences."
        run: python src/youtube_upload.py

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-diagnostics-${{ github.run_id }}
          path: |
            output/
            assets/visuals/sources.txt
          if-no-files-found: ignore
          retention-days: 7
