name: Generate AI Video with Wan 2.2

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Video goal"
        required: false
        default: "Create a high-quality original cinematic animated YouTube Short."
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  VIDEO_ENGINE: wan
  WAN_MODEL_ID: Wan-AI/Wan2.2-TI2V-5B
  WAN_SIZE: "1280*704"

jobs:
  generate:
    # Requires a self-hosted Linux GPU runner with CUDA and >=24 GB VRAM.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install Wan dependencies
        run: |
          if [ ! -d third_party/Wan2.2 ]; then
            git clone --depth 1 https://github.com/Wan-Video/Wan2.2.git third_party/Wan2.2
          fi
          python -m pip install -r third_party/Wan2.2/requirements.txt

      - name: Verify CUDA
        run: |
          python - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("CUDA GPU is required for Wan 2.2")
          print(torch.cuda.get_device_name(0))
          print(f"VRAM: {torch.cuda.get_device_properties(0).total_memory / 1024**3:.1f} GB")
          PY

      - name: Download Wan 2.2 model into workspace
        run: |
          mkdir -p models/Wan2.2-TI2V-5B
          if [ ! -f models/Wan2.2-TI2V-5B/config.json ]; then
            huggingface-cli download Wan-AI/Wan2.2-TI2V-5B --local-dir models/Wan2.2-TI2V-5B
          fi

      - name: Generate Gemini narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_GOAL: ${{ inputs.goal }}
        run: python src/main.py

      - name: Generate Wan animation
        run: python src/wan_engine.py

      - name: Generate voice and timings
        run: python src/add_voice.py

      - name: Render final vertical video
        run: python src/render_video.py

      - name: Validate final video
        run: |
          set -e
          test -s output/test-video.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 output/test-video.mp4
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/test-video.mp4)
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 10 <= d <= 46:
              raise SystemExit(f"Invalid video duration: {d:.2f}s")
          print(f"Valid Wan video: {d:.2f}s")
          PY

      - name: Upload final video to YouTube
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_PRIVACY: public
        run: python src/youtube_upload.py
