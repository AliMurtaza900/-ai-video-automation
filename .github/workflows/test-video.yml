name: Test AI Video

on:
  workflow_dispatch:

concurrency:
  group: test-ai-video
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py

      - name: Fetch relevant free visuals
        run: python src/fetch_visuals.py

      - name: Generate voice and timings
        run: python src/add_voice.py

      - name: Render test video
        run: python src/render_video.py

      - name: Verify test output
        run: |
          test -s output/test-video.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/test-video.mp4

      - name: Upload test video artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: output/test-video.mp4
          if-no-files-found: error
