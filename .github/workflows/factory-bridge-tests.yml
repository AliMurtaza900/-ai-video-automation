name: Factory Bridge Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt && python -m pip install cairosvg piper-tts==1.6.0
      - name: Run bridge tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Python sources
        run: python -m compileall -q src tests
