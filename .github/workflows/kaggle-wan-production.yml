name: Free Kaggle Wan 2.2 Production

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Video goal"
        required: false
        default: "Create a cinematic, high-retention YouTube Short about a surprising fact"
      max_shots:
        description: "Maximum Wan shots (start with 2 on free GPU)"
        required: false
        default: "2"

jobs:
  kaggle-wan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade "kaggle>=2.2.4"

      - name: Configure Kaggle authentication
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kaggle"

          if [ -n "${KAGGLE_API_TOKEN:-}" ]; then
            echo "Using Kaggle API token authentication"
          elif [ -n "${KAGGLE_USERNAME:-}" ] && [ -n "${KAGGLE_KEY:-}" ]; then
            echo "Using Kaggle username/API-key authentication"
            printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          else
            echo "Missing Kaggle credentials. Add KAGGLE_API_TOKEN, or KAGGLE_USERNAME + KAGGLE_KEY, to GitHub Actions secrets."
            exit 1
          fi

          kaggle --version
          kaggle kernels list --mine --page-size 1 >/dev/null
          echo "Kaggle credentials validated successfully."

      - name: Build Kaggle kernel package
        env:
          KAGGLE_OWNER: alimurtaza904
          GOAL: ${{ inputs.goal }}
          MAX_SHOTS: ${{ inputs.max_shots }}
          REPO_REF: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$KAGGLE_OWNER"
          rm -rf .kaggle-kernel kaggle-output
          mkdir -p .kaggle-kernel

          # Always use the newest runner from main. This prevents an old
          # manually-dispatched/re-run workflow from packaging a stale runner.
          curl -fsSL "https://raw.githubusercontent.com/AliMurtaza900/-ai-video-automation/main/kaggle/wan_runner.py" \
            -o .kaggle-kernel/wan_runner.py
          test -s .kaggle-kernel/wan_runner.py
          echo "Packaged Wan runner:"
          sha256sum .kaggle-kernel/wan_runner.py
          grep -n "find_config\|--no-deps\|WAN_SIZE" .kaggle-kernel/wan_runner.py || true

          python - <<'PY'
          import json, os
          from pathlib import Path

          username = os.environ['KAGGLE_OWNER'].strip()
          run_id = os.environ['RUN_ID'].strip()
          kernel_id = f"{username}/wan-2-2-ai-video-automation-{run_id}"
          title = f"Wan 2 2 AI Video Automation {run_id}"

          Path('.kaggle-kernel/job_config.json').write_text(json.dumps({
              'repo': 'https://github.com/AliMurtaza900/-ai-video-automation.git',
              'ref': os.environ['REPO_REF'],
              'goal': os.environ['GOAL'],
              'max_shots': int(os.environ['MAX_SHOTS']),
          }), encoding='utf-8')

          metadata = {
              'id': kernel_id,
              'title': title,
              'code_file': 'wan_runner.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': True,
              'enable_internet': True,
              'machine_shape': 'NvidiaTeslaT4',
              'dataset_sources': [],
              'competition_sources': [],
              'kernel_sources': [],
              'model_sources': [],
          }

          Path('.kaggle-kernel/kernel-metadata.json').write_text(
              json.dumps(metadata, indent=2), encoding='utf-8'
          )
          Path('.kaggle-kernel/kernel_id.txt').write_text(kernel_id, encoding='utf-8')
          print('Kernel id:', kernel_id)
          print('Metadata:', json.dumps(metadata, indent=2))
          PY

      - name: Submit Kaggle GPU job
        run: |
          set -euo pipefail
          KERNEL="$(cat .kaggle-kernel/kernel_id.txt)"
          echo "Submitting exact Kaggle kernel: $KERNEL"
          # Explicit accelerator selection is required by current Kaggle CLI/API.
          kaggle kernels push -p .kaggle-kernel --accelerator NvidiaTeslaT4 --timeout 10800

      - name: Wait for Kaggle job
        id: wait-kaggle
        continue-on-error: true
        run: |
          set -u
          KERNEL="$(cat .kaggle-kernel/kernel_id.txt)"
          FINAL_STATUS="unknown"
          for i in $(seq 1 170); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "--- Kaggle status check $i/170 ---"
            echo "$STATUS"
            FINAL_STATUS="$STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|success'; then
              echo "success" > .kaggle-kernel/status.txt
              exit 0
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancel'; then
              echo "$STATUS" > .kaggle-kernel/status.txt
              echo "failure" > .kaggle-kernel/result.txt
              exit 1
            fi
            sleep 60
          done
          echo "$FINAL_STATUS" > .kaggle-kernel/status.txt
          echo "timeout" > .kaggle-kernel/result.txt
          exit 1

      - name: Collect Kaggle diagnostics
        if: always()
        run: |
          set +e
          KERNEL="$(cat .kaggle-kernel/kernel_id.txt)"
          echo "========== FINAL KAGGLE STATUS =========="
          kaggle kernels status "$KERNEL" || true
          echo "========== KAGGLE RUNTIME LOG =========="
          kaggle kernels logs "$KERNEL" || true
          echo "========== KAGGLE OUTPUT FILES =========="
          kaggle kernels files "$KERNEL" --page-size 200 || true
          echo "========== END KAGGLE DIAGNOSTICS =========="

      - name: Fail if Kaggle job did not succeed
        run: |
          set -euo pipefail
          KERNEL="$(cat .kaggle-kernel/kernel_id.txt)"
          STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
          echo "$STATUS"
          if ! echo "$STATUS" | grep -Eqi 'complete|success'; then
            echo "Kaggle GPU generation did not complete successfully. See the diagnostic log above."
            exit 1
          fi

      - name: Download Kaggle outputs
        run: |
          set -euo pipefail
          mkdir -p kaggle-output output
          KERNEL="$(cat .kaggle-kernel/kernel_id.txt)"
          kaggle kernels output "$KERNEL" -p kaggle-output -o
          find kaggle-output -maxdepth 2 -type f -print
          test -s kaggle-output/final-video.mp4

      - name: Upload final video to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          VIDEO_GOAL: ${{ inputs.goal }}
          YOUTUBE_TITLE: ${{ inputs.goal }}
          YOUTUBE_PRIVACY: "private"
          YOUTUBE_MADE_FOR_KIDS: "false"
          SKIP_YOUTUBE_UPLOAD: "false"
        run: |
          set -euo pipefail
          cp kaggle-output/final-video.mp4 output/final-video.mp4
          if [ -f kaggle-output/voice.mp3 ]; then cp kaggle-output/voice.mp3 output/voice.mp3; fi
          if [ -f kaggle-output/script.txt ]; then cp kaggle-output/script.txt output/script.txt; fi
          python -m pip install -r requirements.txt
          python src/youtube_upload.py
          test -s output/youtube_upload.json
          echo "YouTube upload completed. The video is PRIVATE for review."

      - name: Upload GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-wan2.2-run-${{ github.run_id }}
          path: |
            .kaggle-kernel/status.txt
            .kaggle-kernel/result.txt
            output/final-video.mp4
            output/script.txt
            output/youtube_upload.json
            kaggle-output/sources.txt
          if-no-files-found: warn
