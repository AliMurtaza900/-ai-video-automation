name: Free Kaggle Wan 2.2 Production

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Video goal"
        required: false
        default: "Create a cinematic, high-retention YouTube Short about a surprising fact"
      max_shots:
        description: "Maximum Wan shots (start with 2 on free GPU)"
        required: false
        default: "2"

jobs:
  kaggle-wan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      # IMPORTANT: this must be a persistent Kaggle kernel that has Internet
      # enabled once in the Kaggle UI. API-pushed kernels may ignore the
      # enable_internet metadata flag.
      KAGGLE_KERNEL_ID: alimurtaza904/wan-2-2-ai-video-automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade "kaggle>=2.2.4"

      - name: Configure and validate Kaggle authentication
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "Missing GitHub Actions secret: KAGGLE_API_TOKEN"; exit 1; }
          kaggle --version
          kaggle kernels list --mine --page-size 1 >/dev/null
          echo "Kaggle token authentication validated successfully."

      - name: Build persistent Kaggle kernel package
        env:
          GOAL: ${{ inputs.goal }}
          MAX_SHOTS: ${{ inputs.max_shots }}
          REPO_REF: main
        run: |
          set -euo pipefail
          rm -rf .kaggle-kernel kaggle-output
          mkdir -p .kaggle-kernel

          curl -fsSL "https://raw.githubusercontent.com/AliMurtaza900/-ai-video-automation/main/kaggle/wan_runner.py" -o .kaggle-kernel/wan_runner.py
          test -s .kaggle-kernel/wan_runner.py

          python - <<'PY'
          import json, os
          from pathlib import Path

          config = {
              'repo': 'https://github.com/AliMurtaza900/-ai-video-automation.git',
              'ref': os.environ['REPO_REF'],
              'goal': os.environ['GOAL'],
              'max_shots': int(os.environ['MAX_SHOTS']),
          }
          runner = Path('.kaggle-kernel/wan_runner.py')
          text = runner.read_text(encoding='utf-8')
          marker = 'EMBEDDED_CONFIG = None'
          if marker not in text:
              raise RuntimeError('wan_runner.py is missing EMBEDDED_CONFIG marker')
          text = text.replace(marker, 'EMBEDDED_CONFIG = ' + repr(config), 1)
          runner.write_text(text, encoding='utf-8')

          metadata = {
              'id': os.environ['KAGGLE_KERNEL_ID'],
              'title': 'Wan 2 2 AI Video Automation',
              'code_file': 'wan_runner.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': True,
              'enable_internet': True,
              'machine_shape': 'NvidiaTeslaT4',
              'dataset_sources': [],
              'competition_sources': [],
              'kernel_sources': [],
              'model_sources': [],
          }
          Path('.kaggle-kernel/kernel-metadata.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          Path('.kaggle-kernel/kernel_id.txt').write_text(os.environ['KAGGLE_KERNEL_ID'], encoding='utf-8')
          print('Persistent kernel:', os.environ['KAGGLE_KERNEL_ID'])
          print('Embedded config:', json.dumps(config, indent=2))
          PY

          sha256sum .kaggle-kernel/wan_runner.py
          grep -n "EMBEDDED_CONFIG\|check_internet\|WAN2GP_COMMIT\|WAN_SIZE\|WAN_STEPS\|WAN_FRAMES" .kaggle-kernel/wan_runner.py

      - name: Submit Kaggle GPU job
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-kernel --accelerator NvidiaTeslaT4 --timeout 10800

      - name: Wait for Kaggle job
        id: wait-kaggle
        continue-on-error: true
        run: |
          set -u
          KERNEL="$(cat .kaggle-kernel/kernel_id.txt)"
          FINAL_STATUS="unknown"
          for i in $(seq 1 170); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "--- Kaggle status check $i/170 ---"
            echo "$STATUS"
            FINAL_STATUS="$STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|success'; then
              echo "success" > .kaggle-kernel/status.txt
              exit 0
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancel'; then
              echo "$STATUS" > .kaggle-kernel/status.txt
              echo "failure" > .kaggle-kernel/result.txt
              exit 1
            fi
            sleep 60
          done
          echo "$FINAL_STATUS" > .kaggle-kernel/status.txt
          echo "timeout" > .kaggle-kernel/result.txt
          exit 1

      - name: Collect Kaggle diagnostics
        if: always()
        run: |
          set +e
          KERNEL="$(cat .kaggle-kernel/kernel_id.txt)"
          echo "========== KAGGLE STATUS =========="
          kaggle kernels status "$KERNEL"
          echo "========== KAGGLE RUNTIME LOG =========="
          kaggle kernels logs "$KERNEL"
          echo "========== KAGGLE OUTPUT FILES =========="
          kaggle kernels files "$KERNEL" --page-size 200
          kaggle kernels status "$KERNEL" > .kaggle-kernel/kaggle-status.log 2>&1
          kaggle kernels logs "$KERNEL" > .kaggle-kernel/kaggle-runtime.log 2>&1
          kaggle kernels files "$KERNEL" --page-size 200 > .kaggle-kernel/kaggle-files.log 2>&1

      - name: Fail if Kaggle job did not succeed
        run: |
          set -euo pipefail
          KERNEL="$(cat .kaggle-kernel/kernel_id.txt)"
          STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
          echo "$STATUS"
          if ! echo "$STATUS" | grep -Eqi 'complete|success'; then
            echo "Kaggle GPU generation failed. Runtime diagnostics were collected above and in the artifact."
            exit 1
          fi

      - name: Download Kaggle outputs
        run: |
          set -euo pipefail
          mkdir -p kaggle-output output
          KERNEL="$(cat .kaggle-kernel/kernel_id.txt)"
          kaggle kernels output "$KERNEL" -p kaggle-output -o
          find kaggle-output -maxdepth 2 -type f -print
          test -s kaggle-output/final-video.mp4

      - name: Upload final video to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          VIDEO_GOAL: ${{ inputs.goal }}
          YOUTUBE_TITLE: ${{ inputs.goal }}
          YOUTUBE_PRIVACY: "private"
          YOUTUBE_MADE_FOR_KIDS: "false"
          SKIP_YOUTUBE_UPLOAD: "false"
        run: |
          set -euo pipefail
          cp kaggle-output/final-video.mp4 output/final-video.mp4
          if [ -f kaggle-output/voice.mp3 ]; then cp kaggle-output/voice.mp3 output/voice.mp3; fi
          if [ -f kaggle-output/script.txt ]; then cp kaggle-output/script.txt output/script.txt; fi
          python -m pip install -r requirements.txt
          python src/youtube_upload.py
          test -s output/youtube_upload.json

      - name: Upload GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-wan2.2-run-${{ github.run_id }}
          path: |
            .kaggle-kernel/status.txt
            .kaggle-kernel/result.txt
            .kaggle-kernel/kaggle-status.log
            .kaggle-kernel/kaggle-runtime.log
            .kaggle-kernel/kaggle-files.log
            output/final-video.mp4
            output/script.txt
            output/youtube_upload.json
            kaggle-output/sources.txt
          if-no-files-found: warn
