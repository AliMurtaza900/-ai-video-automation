name: Test Video Quality (No Gemini)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Factory bridge tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Create deterministic test script
        run: |
          mkdir -p output assets/visuals
          cat > output/script.txt <<'EOF'
In 1945, one man survived an atomic bombing and then faced another just three days later. His story is documented history.
EOF
      - name: Create test narration
        run: python -m edge_tts --text "In 1945, one man survived an atomic bombing and then faced another just three days later. His story is documented history." --voice en-US-GuyNeural --write-media output/voice.mp3
      - name: Create caption timings
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('output/script.txt').read_text().strip()
          words = text.split()
          chunks = [' '.join(words[i:i+9]) for i in range(0, len(words), 9)]
          duration = 20.0
          step = duration / max(1, len(chunks))
          with open('output/caption_timing.txt', 'w', encoding='utf-8') as f:
              for i, chunk in enumerate(chunks):
                  f.write(f'{i*step:.3f}|{min(duration,(i+1)*step):.3f}|{chunk}\n')
          PY
      - name: Create visual test backgrounds
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          out = Path('assets/visuals')
          out.mkdir(parents=True, exist_ok=True)
          for i, label in enumerate(['HISTORY', '1945', 'SURVIVAL', 'DOCUMENTED']):
              image = Image.new('RGB', (1080, 1920), (20 + i * 10, 30 + i * 5, 45 + i * 7))
              draw = ImageDraw.Draw(image)
              draw.text((540, 900), label, anchor='mm', fill='white')
              image.save(out / f'visual_{i:02d}.jpg', quality=90)
          PY
      - name: Render test video
        run: python src/render_video.py
      - name: Validate output
        run: |
          test -s output/test-video.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/test-video.mp4
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: upgraded-video-test
          path: output/test-video.mp4
          retention-days: 2
