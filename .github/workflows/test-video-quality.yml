name: Test Video Quality (No Gemini)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Create fixed test script (no Gemini)
        run: |
          mkdir -p output
          cat > output/script.txt <<'EOF'
In 1945, one man survived an atomic bombing and then faced another just three days later. His story sounds impossible, but it is documented history. He was in Hiroshima when the first bomb exploded. He survived and returned home to Nagasaki. Then the second atomic bomb exploded. Somehow, he survived that too. His story became one of the most extraordinary survival stories of the twentieth century.
EOF

      - name: Create simple test narration without Gemini
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          text = Path('output/script.txt').read_text().strip()
          subprocess.run(['python','-m','edge_tts','--text',text,'--voice','en-US-GuyNeural','--write-media','output/voice.mp3'], check=True)
          PY

      - name: Create caption timings without Gemini
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('output/script.txt').read_text().strip()
          words = text.split()
          chunks=[]
          for i in range(0,len(words),9):
              chunks.append(' '.join(words[i:i+9]))
          duration=40.0
          step=duration/max(1,len(chunks))
          with open('output/caption_timing.txt','w') as f:
              for i,c in enumerate(chunks):
                  f.write(f'{i*step:.3f}|{min(duration,(i+1)*step):.3f}|{c}\n')
          PY

      - name: Create visual test backgrounds
        run: |
          mkdir -p assets/visuals
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          Path('assets/visuals').mkdir(parents=True, exist_ok=True)
          scenes = [
              ('HIROSHIMA', (18,25,45)), ('1945', (45,28,20)),
              ('SURVIVAL', (22,42,38)), ('NAGASAKI', (35,24,48)),
              ('SECOND BLAST', (55,35,18)), ('DOCUMENTED HISTORY', (20,35,52)),
          ]
          for i,(label,bg) in enumerate(scenes):
              im=Image.new('RGB',(1080,1920),bg)
              d=ImageDraw.Draw(im)
              d.text((540,850),label,anchor='mm',fill='white')
              d.text((540,950),'TEST VISUAL',anchor='mm',fill='white')
              im.save(f'assets/visuals/visual_{i:02d}.jpg',quality=90)
          PY

      - name: Render upgraded video
        run: python src/render_video.py

      - name: Upload test video artifact
        uses: actions/upload-artifact@v4
        with:
          name: upgraded-video-test
          path: output/test-video.mp4
          retention-days: 2
