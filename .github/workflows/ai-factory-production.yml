name: AI Factory Production

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Production goal for the next children's animation"
        required: false
        default: "Create an original animated children's poem with recurring cartoon characters"
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

concurrency:
  group: ai-factory-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      FFMPEG_THREADS: '2'
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_PRIVACY: public
      VIDEO_GOAL: ${{ inputs.goal || 'Create an original animated children''s poem with recurring cartoon characters' }}
      AI_ANIMATION_COMMAND: ${{ secrets.AI_ANIMATION_COMMAND }}

    steps:
      - name: Checkout video automation
        uses: actions/checkout@v4
        with:
          path: video

      - name: Checkout AI Factory
        uses: actions/checkout@v4
        with:
          repository: AliMurtaza900/-ai-factory
          path: factory

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install video dependencies
        working-directory: video
        run: python -m pip install -r requirements.txt

      - name: Verify animation and Factory modules compile
        run: |
          python -m compileall -q video/src video/tests
          python -m compileall -q factory/factory

      - name: Run animation safety tests
        working-directory: video
        run: python -m unittest tests/test_kids_animation_studio.py tests/test_animation_renderer.py tests/test_factory_bridge.py

      - name: Require real animation backend
        run: test -n "$AI_ANIMATION_COMMAND"

      - name: Run resumable AI Factory production job
        working-directory: factory
        env:
          AI_FACTORY_VIDEO_COMMAND: python ${{ github.workspace }}/video/src/factory_bridge.py
          AI_FACTORY_VIDEO_TIMEOUT: '4500'
        run: |
          set -euo pipefail
          python -m factory.production "$VIDEO_GOAL" \
            --workspace "${{ github.workspace }}/video/data/factory-workspaces" \
            --state-dir "${{ github.workspace }}/video/data/factory-jobs"

      - name: Persist Factory production state in video repository
        if: always()
        run: |
          set -e
          cd video
          git config user.name "ai-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/factory-workspaces data/factory-jobs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Factory state changes to commit."
            exit 0
          fi
          git commit -m "Persist AI Factory production state"
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "WARNING: Could not persist Factory state to video repository."
