name: AI Factory Production

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Production goal for the next video"
        required: false
        default: "Create a high-retention, monetization-safe YouTube Short about a genuinely surprising fact"
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

concurrency:
  group: ai-factory-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      FFMPEG_THREADS: '2'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_PRIVACY: public
      VIDEO_GOAL: ${{ inputs.goal || 'Create a high-retention, monetization-safe YouTube Short about a genuinely surprising fact' }}

    steps:
      - name: Checkout video automation
        uses: actions/checkout@v4
        with:
          path: video
          fetch-depth: 0

      - name: Checkout AI Factory
        uses: actions/checkout@v4
        with:
          repository: AliMurtaza900/-ai-factory
          path: factory

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install video dependencies
        working-directory: video
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify required credentials are configured
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY YOUTUBE_REFRESH_TOKEN YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Actions secret $name is missing or empty."
              exit 1
            fi
          done
          echo "Required production credentials are present."

      - name: Verify Factory production modules compile
        working-directory: factory
        run: python -m compileall -q factory

      - name: Verify video modules compile
        working-directory: video
        run: python -m compileall -q src

      - name: Run video pipeline contract tests
        working-directory: video
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          else
            echo "No tests directory; compile validation already completed."
          fi

      - name: Run resumable AI Factory production job
        working-directory: factory
        env:
          AI_FACTORY_VIDEO_COMMAND: python ${{ github.workspace }}/video/src/factory_bridge.py
          AI_FACTORY_VIDEO_TIMEOUT: '3000'
        run: |
          set -euo pipefail
          python -m factory.production "$VIDEO_GOAL" \
            --workspace "${{ github.workspace }}/video/data/factory-workspaces" \
            --state-dir "${{ github.workspace }}/video/data/factory-jobs"

      - name: Verify final production output
        if: success()
        working-directory: video
        run: |
          set -euo pipefail
          test -s output/final-video.mp4
          test -s output/voice.mp3
          test -s output/youtube_upload.json
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 output/final-video.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 output/final-video.mp4
          echo "Final video contract verified."

      - name: Persist Factory production state in video repository
        if: always()
        run: |
          set -euo pipefail
          cd video
          git config user.name "ai-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase before committing generated state. This avoids creating a
          # commit and then rebasing that commit into an unstaged/conflicted state.
          git fetch origin main
          git rebase origin/main
          git add -A data/factory-workspaces data/factory-jobs
          if git diff --cached --quiet; then
            echo "No Factory state changes to commit."
            exit 0
          fi
          git commit -m "Persist AI Factory production state"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Factory state persisted."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            git add -A data/factory-workspaces data/factory-jobs
            sleep $((attempt * 5))
          done
          echo "WARNING: Could not persist Factory state to video repository."
          exit 0
